services:
  db:
    image: postgres:17-alpine
    container_name: marketplace_db
    environment:
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketplace_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: marketplace_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "docker-compose-secret-key-change-in-production"
      DATABASE_NAME: "marketplace_db"
      DATABASE_USER: "postgres"
      DATABASE_PASSWORD: "postgrespassword"
      DATABASE_HOST: "db"
      DATABASE_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: marketplace_celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      DATABASE_NAME: "marketplace_db"
      DATABASE_USER: "postgres"
      DATABASE_PASSWORD: "postgrespassword"
      DATABASE_HOST: "db"
      DATABASE_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: marketplace_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      DATABASE_NAME: "marketplace_db"
      DATABASE_USER: "postgres"
      DATABASE_PASSWORD: "postgrespassword"
      DATABASE_HOST: "db"
      DATABASE_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
