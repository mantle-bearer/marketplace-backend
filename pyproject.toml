[project]
name = "marketplace-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.2",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
    "python-decouple>=3.8",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.86",
]

[tool.ruff]
target-version = "py314"
exclude = [
    "**/migrations/*",
    ".venv",
]

[tool.ruff.lint]
ignore = [
    "RUF012",  # Mutable class attributes in Django models and DRF views
    "BLE001",  # Blind exception catches in fallback hooks
]

[tool.ty.rules]
invalid-attribute-override = "ignore"

